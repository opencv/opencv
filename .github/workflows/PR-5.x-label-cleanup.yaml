name: PR:5.x CI label cleanup

on:
  pull_request_target:
    branches:
      - 5.x
    types: [synchronize]
  workflow_run:
    workflows: ["PR:5.x"]
    types: [completed]

permissions:
  issues: write
  pull-requests: read

jobs:
  reset-on-new-commit:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    steps:
      - name: Reset CI mode labels
        uses: actions/github-script@v7
        with:
          script: |
            const currentLabels = new Set(
              context.payload.pull_request.labels.map(label => label.name)
            );
            for (const label of ['ci:fast', 'ci:full']) {
              if (!currentLabels.has(label)) {
                continue;
              }
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: context.issue.number,
                  name: label,
                });
                core.info(`Removed ${label} from PR #${context.issue.number}`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

  cleanup:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Remove consumed CI mode labels
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const flags = (run.display_title || '').match(
              /^PR #(\d+) \[ci-fast=(true|false),ci-full=(true|false)\]$/
            );
            if (!flags) {
              core.notice('No CI mode labels recorded for this run');
              return;
            }
            const pullNumber = Number(flags[1]);
            const eventPullNumber = run.pull_requests?.[0]?.number;
            if (eventPullNumber && eventPullNumber !== pullNumber) {
              core.setFailed('Recorded PR number does not match the workflow event');
              return;
            }
            const labels = [];
            if (flags[2] === 'true') labels.push('ci:fast');
            if (flags[3] === 'true') labels.push('ci:full');
            if (labels.length === 0) {
              return;
            }

            const {data: pull} = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });
            if (pull.head.sha !== run.head_sha) {
              core.notice('A newer PR commit exists; keeping its CI mode labels');
              return;
            }

            const currentLabels = new Set(pull.labels.map(label => label.name));
            for (const label of labels) {
              if (!currentLabels.has(label)) {
                continue;
              }
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: pullNumber,
                  name: label,
                });
                core.info(`Removed ${label} from PR #${pullNumber}`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
